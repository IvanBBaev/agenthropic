# WP-X7 - build & publish the docs corpus to GitHub Pages.
#
# Generator neutrality: ADR-0013 (docs/site/contributing/decisions/
# adr-docs-site-generator.md) explicitly DEFERS the docs-site generator choice
# to DOC-P1. This workflow deliberately does not decide it: the tool-agnostic
# Markdown tree is rendered with the stock GitHub Pages Jekyll builder
# (actions/jekyll-build-pages - the official starter-workflow path), which adds
# ZERO dependencies to the repository. When DOC-P1 picks a generator
# (VitePress / Docusaurus / MkDocs Material), replace the build job wholesale.
#
# Source root is docs/ (not docs/site/): the site tree cross-links heavily into
# ../analysis/*, ../DOCS-PLAN.md and ../due-diligence/* (129 relative links at
# the time of writing), so publishing docs/site alone would break them all.
# docs/ai/ is local-only (git-excluded) and never present in the CI checkout.
#
# The default GitHub Pages plugin set does the heavy lifting:
#   - jekyll-optional-front-matter: renders plain CommonMark pages as-is
#   - jekyll-relative-links: rewrites relative *.md links to the rendered pages
#   - jekyll-readme-index: docs/site/README.md becomes /site/index.html
#   - jekyll-titles-from-headings + the default Primer theme
#
# Pages enablement WAS an OWNER ACTION, not something this workflow could do.
# An earlier revision of this comment claimed the `enablement: true` input below
# removes the one-time Settings -> Pages click. That claim was wrong and the
# workflow proved it: run 30528892265 failed before the input was added, and
# runs 31318246506 and 31879212583 failed twice more after it was added:
#
#   Get Pages site failed. Error: Not Found
#   Create Pages site failed. Error: Resource not accessible by integration
#
# `pages: write` lets a workflow DEPLOY to an existing Pages site; it does not
# let the default GITHUB_TOKEN CREATE one. Creation needs a token with repo
# administration rights, which a workflow token deliberately never has. That is
# the whole reason this mistake is worth recording: no workflow edit could have
# fixed it, so every run of this workflow failed at the Configure Pages step.
# Failing there was honest - it failed loudly rather than deploying nowhere -
# but it was a red run on main for as long as it lasted.
#
# RESOLVED 2026-08-25 by an owner-credentialled call, `gh api -X POST
# repos/IvanBBaev/agenthropic/pages -f build_type=workflow` (equivalently,
# Settings -> Pages -> Source: "GitHub Actions" once). Run 32863218759 was then
# re-run and SUCCEEDED, and the site serves at
# https://ivanbbaev.github.io/agenthropic/ - `/` and `/site/` both return 200.
# Verify with `gh api repos/IvanBBaev/agenthropic --jq .has_pages` -> true.
# The `enablement: true` input is kept: it is idempotent now that Pages exists,
# and if the site were ever deleted the denial message above names the cause
# better than a bare 404.
#
# What enabling changed for the repository: has_pages is now true and docs/ is
# published at the project's github.io URL. That is a deliberate public
# surface, and the only one: the application itself stays bound to 127.0.0.1
# (ADR-0013). docs/ai/ is git-excluded and never present in the CI checkout, so
# no local-only harness file can reach the published site.
name: Docs site (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a running production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          # A no-op since 2026-08-25, when the owner created the Pages site;
          # before that it failed with "Resource not accessible by integration"
          # rather than a bare 404. See the enablement note in the header -
          # this input cannot self-serve, it only reports the denial better.
          enablement: true

      - name: Add build-time site scaffolding (runner workspace only, never committed)
        run: |
          # Minimal Jekyll config: only forces inclusion of the underscore-
          # prefixed ADR template (linked from five pages; Jekyll drops _* files
          # by default). Everything else stays at Pages defaults.
          cat > docs/_config.yml <<'EOF'
          title: agenthropic
          description: Self-hosted, local-first dashboard observing Claude Code agent/subagent activity
          include:
            - _adr-template.md
            - site/contributing/decisions/_adr-template.md
          EOF
          # docs/ has no README.md of its own, so the site root would 404.
          # Generate a small landing page pointing into the published trees.
          cat > docs/index.md <<'EOF'
          # agenthropic documentation

          Self-hosted, local-first dashboard for observing Claude Code agent and
          subagent activity - the persisted subagent DAG with dollar-accurate
          cost attribution.

          - [Documentation site](site/README.md) - start here (guide,
            architecture, usage, security, operations, contributing, ADRs)
          - [Decision spine / analysis corpus](analysis/README.md) - the
            due-diligence record behind every decision
          - [Docs plan](DOCS-PLAN.md) - how this corpus is produced

          Source: [github.com/IvanBBaev/agenthropic](https://github.com/IvanBBaev/agenthropic)
          EOF

      - name: Build with the stock GitHub Pages Jekyll builder
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
