# CI quality gate: no-spawner gate, typecheck, lint, format, web production
# build, tests (with the per-package Vitest coverage thresholds), license gate.
# The security gate runs first so a broken invariant fails in seconds rather
# than after the suite.
#
# NOTE: this workflow used to carry a note saying that making it merge-blocking
# required a GitHub branch-protection rule that was an owner action, still unset.
# That rule exists as of 2026-08-25: `main` requires the status-check context
# `ci` - which is the JOB ID below (lowercase), NOT this workflow's display name
# `CI`. Renaming the `ci:` job therefore silently drops the protection until the
# rule is updated on github.com. Force-pushes to `main` and deletion of `main`
# are refused for everyone.
#
# `enforce_admins` is deliberately OFF: a red run withholds the merge button from
# a contributor, but not from the repository owner. agenthropic has exactly one
# maintainer whose normal working mode is a direct push to `main`, and turning
# admin enforcement on would lock the sole maintainer out of their own
# repository. That is a stated design choice, not an oversight.
#
# The rule itself still lives on github.com and cannot be configured from this
# file. Verify it with:
#   gh api repos/IvanBBaev/agenthropic/branches/main/protection \
#     --jq '{contexts: .required_status_checks.contexts, enforce_admins: .enforce_admins.enabled}'
#   -> {"contexts":["ci"],"enforce_admins":false}
# Full write-up: docs/site/contributing/decisions/README.md
# ("A standing correction: merge-blocking").
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Enable corepack (pnpm from packageManager field)
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # The security gate runs first, before the slow steps. It is the cheapest
      # check in the workflow and the only one guarding an invariant the project
      # cannot walk back: no subprocess spawner, no wide bind, no eval. A change
      # that breaks it should be told so in seconds, not after a full test run.
      - name: Security gate - no spawner / no wide bind / no eval
        run: pnpm run gate:spawner

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      # The SPA's production build is its own gate: unit tests exercise modules
      # under the Vitest transform, so a change that only breaks `vite build`
      # (rollup resolution, static assets, env handling) would otherwise merge
      # green and first fail at release time. Runs before the suite because it
      # is the cheaper step.
      - name: Web production build
        run: pnpm --filter @agenthropic/web build

      - name: Test (coverage thresholds enforce the coverage gate)
        run: pnpm run test

      - name: License gate (CD-9 allowlist)
        run: pnpm run gate:licenses
