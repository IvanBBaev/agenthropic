# CI quality gate: no-spawner gate, typecheck, lint, format, web production
# build, tests (with the per-package Vitest coverage thresholds), license gate.
# The security gate runs first so a broken invariant fails in seconds rather
# than after the suite.
#
# A second, non-required job (`macos`, QA-6) re-runs the filesystem-touching
# suites on macOS without coverage. A third, non-required job (`node24`, OSS-12,
# at the bottom) rehearses the next Node LTS line against the full gate.
#
# NOTE: this workflow used to carry a note saying that making it merge-blocking
# required a GitHub branch-protection rule that was an owner action, still unset.
# That rule exists as of 2026-08-25: `main` requires the status-check context
# `ci` - which is the JOB ID below (lowercase), NOT this workflow's display name
# `CI`. Renaming the `ci:` job therefore silently drops the protection until the
# rule is updated on github.com. Force-pushes to `main` and deletion of `main`
# are refused for everyone.
#
# `enforce_admins` is deliberately OFF: a red run withholds the merge button from
# a contributor, but not from the repository owner. agenthropic has exactly one
# maintainer whose normal working mode is a direct push to `main`, and turning
# admin enforcement on would lock the sole maintainer out of their own
# repository. That is a stated design choice, not an oversight.
#
# The rule itself still lives on github.com and cannot be configured from this
# file. Verify it with:
#   gh api repos/IvanBBaev/agenthropic/branches/main/protection \
#     --jq '{contexts: .required_status_checks.contexts, enforce_admins: .enforce_admins.enabled}'
#   -> {"contexts":["ci"],"enforce_admins":false}
# Full write-up: docs/site/contributing/decisions/README.md
# ("A standing correction: merge-blocking").
name: CI

on:
  push:
    branches: [main]
    # OSS-11: a pushed release tag gets its own run, so "CI green on the tag
    # ref" (RELEASE.md, post-tag) names a run that exists. Without this a tag
    # push started nothing and only the run on the release commit could stand in.
    tags: ['v*']
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # A hung SSE or watcher test would otherwise run to GitHub's 6 h default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable corepack (pnpm from packageManager field)
        run: corepack enable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # The security gate runs first, before the slow steps. It is the cheapest
      # check in the workflow and the only one guarding an invariant the project
      # cannot walk back: no subprocess spawner, no wide bind, no eval. A change
      # that breaks it should be told so in seconds, not after a full test run.
      - name: Security gate - no spawner / no wide bind / no eval
        run: pnpm run gate:spawner

      # R5: production dependencies carry no high or critical advisory. The bump
      # alone does not keep it that way; this step fails when one comes back.
      - name: Audit production dependencies (no high or critical)
        run: pnpm audit --prod --audit-level=high

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      # The SPA's production build is its own gate: unit tests exercise modules
      # under the Vitest transform, so a change that only breaks `vite build`
      # (rollup resolution, static assets, env handling) would otherwise merge
      # green and first fail at release time. Runs before the suite because it
      # is the cheaper step.
      - name: Web production build
        run: pnpm --filter @agenthropic/web build

      - name: Test (coverage thresholds enforce the coverage gate)
        run: pnpm run test

      - name: License gate (CD-9 allowlist)
        run: pnpm run gate:licenses

  # QA-6: the product runs on macOS (APFS: case-insensitive by default, its own
  # lstat / O_NOFOLLOW / fsync / chmod behaviour), while the `ci` job above runs
  # on Linux only, so the fake-vs-real fs parity was proven on one OS. This job
  # runs the suites that touch the real filesystem on macOS: all of apps/server
  # (corpus reader, backup/restore, retention, file modes, hooks installer,
  # service installer) and packages/test-fixtures. It runs whole suites, not a
  # hand-picked file list, so a new fs test is covered without anyone editing
  # this job; the server suite takes about 35 s on an M4.
  #
  # Coverage is OFF here (`vitest run`, no `--coverage`): the thresholds are the
  # `ci` job's gate, and enforcing them on a subset of packages would fail on
  # code this job never runs. It is NOT a required check: branch protection
  # names only the `ci` context, so a red run here is loud but does not withhold
  # a merge. Promote it to required (add `macos` to the protection rule on
  # github.com) once it has been green for a while.
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable corepack (pnpm from packageManager field)
        run: corepack enable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # The same Node-major guard the package `test` scripts run first, since
      # `vitest run` below is invoked directly and would otherwise skip it.
      - name: Node major matches .nvmrc
        run: node scripts/check-node-version.mjs

      - name: Server tests on macOS (no coverage)
        run: pnpm --filter @agenthropic/server exec vitest run

      - name: Test-fixtures tests on macOS (no coverage)
        run: pnpm --filter @agenthropic/test-fixtures exec vitest run

  # OSS-12: the project pins Node 22 (`.nvmrc`, `engines.node` `>=22 <23`), and
  # Node 22 reaches end of life on 2027-04-30 - inside the v1.x line's life. This
  # job rehearses the next LTS line, Node 24, so the move is a measured step and
  # not a surprise. It runs the same gate as `ci` (typecheck, web build, the full
  # suite WITH the coverage thresholds) under Node 24.
  #
  # The pin itself is not widened here. The job rewrites `.nvmrc` to 24 in its
  # own checkout, so `scripts/check-node-version.mjs` checks the Node it really
  # runs on, and installs with `engine-strict` off, because `engines.node` still
  # says `<23`. Nothing in this job is committed back. Widening the pin is a
  # separate change, made once this job has been green for a while; see "Node
  # support policy" in docs/site/guide/running.md.
  #
  # NOT a required check, like `macos`: branch protection names only `ci`.
  node24:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable corepack (pnpm from packageManager field)
        run: corepack enable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # Point the Node-major guard at the Node this job runs, in this checkout only.
      - name: Rehearse the Node 24 pin (.nvmrc -> 24, not committed)
        run: echo 24 > .nvmrc

      - name: Install (frozen lockfile, engines not enforced)
        run: pnpm install --frozen-lockfile --config.engine-strict=false

      - name: Typecheck
        run: pnpm run typecheck

      - name: Web production build
        run: pnpm --filter @agenthropic/web build

      - name: Test on Node 24 (coverage thresholds enforce the coverage gate)
        run: pnpm run test
