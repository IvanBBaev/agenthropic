# SEC-9 / OSS-10 / OSS-13 - dependency and Action update policy.
#
# Every Action in .github/workflows is pinned to a full commit SHA with the
# release it came from in a trailing comment. Dependabot keeps both current: it
# rewrites the SHA and the comment together, so a pin is never left to rot.
#
# npm covers the whole pnpm workspace from the root lockfile. Minor and patch
# bumps arrive as one grouped PR a week, and each major as its own PR, because a
# major is a decision, not maintenance. Every PR runs the full CI gate.
#
# OSS-13: some packages only work at matching majors, so a major of one alone
# fails CI and is closed. Each such family gets one major PR: vitest with
# @vitest/coverage-v8, eslint with @eslint/js, vite with @vitejs/plugin-react,
# and react with react-dom and their @types. Dependabot puts a dependency in the
# first group it matches. A major never matches minor-and-patch, so it falls
# through to its family group, or to its own PR when it has no family.
#
# @types/node majors are ignored. The types follow the Node pin, which moves on
# purpose (docs/site/guide/running.md, "Node support policy"), not with Node's
# newest release line.
#
# `tsx` is pinned to an exact version on purpose (ARC-2): stored migration
# checksums depend on its printer. A tsx bump PR is welcome, but merge it only
# when migrations-checksum-stability.test.ts is green on it.
#
# This file only describes the policy. Dependabot alerts and security updates
# are switched on in the repository settings on GitHub.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      vitest-major:
        patterns: [vitest, '@vitest/*']
        update-types: [major]
      eslint-major:
        patterns: [eslint, '@eslint/*']
        update-types: [major]
      vite-major:
        patterns: [vite, '@vitejs/*']
        update-types: [major]
      react-major:
        patterns: [react, react-dom, '@types/react', '@types/react-dom']
        update-types: [major]
