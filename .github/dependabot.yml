# SEC-9 / OSS-10 / OSS-13 - dependency and Action update policy.
#
# Every Action in .github/workflows is pinned to a full commit SHA with the
# release it came from in a trailing comment. Dependabot keeps both current: it
# rewrites the SHA and the comment together, so a pin is never left to rot.
#
# npm covers the whole pnpm workspace from the root lockfile. Minor and patch
# bumps arrive as one grouped PR a week, and each major as its own PR, because a
# major is a decision, not maintenance. Every PR runs the full CI gate.
#
# `tsx` is pinned to an exact version on purpose (ARC-2): stored migration
# checksums depend on its printer. A tsx bump PR is welcome, but merge it only
# when migrations-checksum-stability.test.ts is green on it.
#
# This file only describes the policy. Dependabot alerts and security updates
# are switched on in the repository settings on GitHub.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
